<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Depoimento Maria</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(assets/fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:500;src:url(assets/fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:600;src:url(assets/fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:700;src:url(assets/fonts/inter-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Serif;font-style:italic;src:url(assets/fonts/instrument-serif-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:Mono;src:url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f2efea;font-family:Inter,sans-serif;color:#1d1a17}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#f2efea}
.layer{position:absolute;inset:0}
.c{position:absolute;transform:translate(-50%,-50%)}
.blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.6}
.card{background:#fff;border-radius:30px;box-shadow:0 18px 50px rgba(60,40,20,.12),0 2px 6px rgba(60,40,20,.06)}
.mono{font-family:Mono,monospace;letter-spacing:3px;text-transform:uppercase;color:#9a8f86}
.serif{font-family:Serif,serif;font-style:italic}
.ico{width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(60,40,20,.18)}
.chk{width:34px;height:34px;border-radius:9px;border:2px solid #d9d2ca;display:flex;align-items:center;justify-content:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:12px;background:#fff;border-radius:30px;padding:12px 24px 12px 14px;font-size:30px;font-weight:500;box-shadow:0 8px 20px rgba(60,40,20,.1);white-space:nowrap}
.chip .chk{width:30px;height:30px;background:#cbab93;border:none}
.scene{position:absolute;inset:0;display:none}
#capLead{position:absolute;left:60px;right:60px;text-align:center;font-size:48px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
#capLead .w{display:inline-block;white-space:pre}
#capBox{position:absolute;left:540px;white-space:nowrap;font-family:Serif,serif;font-style:italic;font-size:104px;line-height:1.08;padding:2px 30px 10px;background:#cbab93;color:#2b1d14;box-shadow:0 10px 30px rgba(80,50,30,.18)}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg">
    <div class="blob" id="b1" style="left:-160px;top:180px;width:620px;height:520px;background:#e9c3a6"></div>
    <div class="blob" id="b2" style="left:640px;top:-80px;width:620px;height:560px;background:#c9dbf2"></div>
    <div class="blob" id="b3" style="left:-120px;top:1380px;width:680px;height:620px;background:#f6dc95"></div>
    <div class="blob" id="b4" style="left:700px;top:1480px;width:600px;height:560px;background:#f4b9a4"></div>
  </div>

  <!-- UI scenes (behind photo) -->
  <!-- C clock -->
  <div class="scene" id="sC">
    <div class="c" id="clock" style="left:540px;top:900px;width:480px;height:480px;border-radius:50%;background:linear-gradient(160deg,#ffffff,#ece8e3);box-shadow:0 30px 60px rgba(60,40,20,.16),inset 0 -6px 14px rgba(0,0,0,.05)">
      <svg width="480" height="480" viewBox="-240 -240 480 480" id="clockSvg">
        <g id="ticks"></g>
        <line id="hH" x1="0" y1="0" x2="0" y2="-110" stroke="#1d1a17" stroke-width="10" stroke-linecap="round"/>
        <line id="hM" x1="0" y1="0" x2="0" y2="-170" stroke="#1d1a17" stroke-width="6" stroke-linecap="round"/>
        <line id="hS" x1="0" y1="20" x2="0" y2="-185" stroke="#cbab93" stroke-width="3" stroke-linecap="round"/>
        <circle r="12" fill="#1d1a17"/>
      </svg>
    </div>
    <div class="c" id="hours" style="left:400px;top:1250px;font-size:150px;font-weight:700;letter-spacing:-4px">0h</div>
    <div class="c mono" id="hoursLab" style="left:400px;top:1345px;font-size:24px;white-space:nowrap">sem conseguir dormir</div>
    <div class="c ico" id="moon" style="left:200px;top:760px;background:#1d1a17"><svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></div>
  </div>

  <!-- D checklist -->
  <div class="scene" id="sD">
    <div class="c card" id="list" style="left:540px;top:900px;width:900px;height:560px;padding:40px 40px">
      <div style="display:flex;justify-content:space-between" class="mono"><span style="font-size:22px">antes · como ela se sentia</span><span style="font-size:22px" id="lpct">0%</span></div>
      <div style="height:6px;border-radius:3px;background:#eee8e2;margin-top:18px;overflow:hidden"><div id="lbar" style="height:100%;width:0;background:#cbab93"></div></div>
      <div id="rows" style="margin-top:26px"></div>
    </div>
    <div class="c ico" id="dIco" style="left:960px;top:600px;background:#1d1a17"><svg width="38" height="38" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 7 7 3-7 3-2 7-2-7-7-3 7-3z"/></svg></div>
  </div>

  <!-- F pain dial -->
  <div class="scene" id="sF">
    <div class="c" id="dial" style="left:540px;top:860px;width:520px;height:520px">
      <svg width="520" height="520" viewBox="-260 -260 520 520">
        <circle r="220" fill="none" stroke="#e8e1da" stroke-width="26"/>
        <circle id="ring" r="220" fill="none" stroke="#cbab93" stroke-width="26" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="1382.3" stroke-dashoffset="0"/>
      </svg>
      <div class="c" id="painPct" style="left:260px;top:240px;font-size:150px;font-weight:700;letter-spacing:-5px">80%</div>
      <div class="c mono" style="left:260px;top:345px;font-size:22px;white-space:nowrap">nível de dor</div>
    </div>
    <div class="c card" id="tranq" style="left:420px;top:1240px;width:620px;height:120px;border-radius:24px;display:flex;align-items:center;gap:20px;padding:0 30px">
      <div class="chk" style="background:#1d1a17;border:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></div>
      <div style="flex:1"><div style="font-size:28px;font-weight:600">Tranquilidade</div><div style="height:6px;border-radius:3px;background:#eee8e2;margin-top:10px;overflow:hidden"><div id="tbar" style="height:100%;width:0;background:#cbab93"></div></div></div>
      <div class="mono" id="tpct" style="font-size:22px">0%</div>
    </div>
  </div>

  <!-- H value cards -->
  <div class="scene" id="sH">
    <div id="vcards"></div>
  </div>

  <!-- I final chips -->
  <div class="scene" id="sI">
    <div class="c" id="chips" style="left:540px;top:1560px;display:flex;gap:16px"></div>
  </div>

  <!-- J outro -->
  <div class="scene" id="sJ">
    <div class="c card" id="input" style="left:540px;top:1460px;width:900px;height:120px;border-radius:60px;display:flex;align-items:center;gap:22px;padding:0 24px 0 36px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1d1a17" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <div style="font-size:38px;font-weight:600;flex:1"><span id="typed"></span><span id="caret" style="display:inline-block;width:3px;height:40px;background:#1d1a17;vertical-align:middle;margin-left:3px"></span></div>
      <div id="send" style="width:72px;height:72px;border-radius:50%;background:#efe9e3;display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1d1a17" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div>
    </div>
    <div class="c" id="toast" style="left:540px;top:1590px;background:#1d1a17;color:#fff;border-radius:30px;padding:14px 30px;font-size:28px;font-weight:500;white-space:nowrap">✓ Depoimento real da Maria</div>
  </div>

  <!-- PHOTO (always on screen) -->
  <div class="c" id="photo" style="left:0;top:0;overflow:hidden;background:#cbab93">
    <div id="photoIn" style="position:absolute;overflow:hidden"><img id="pimg" src="assets/maria.jpg" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%;transform-origin:50% 40%"></div>
    <div id="pshade" style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 50%,rgba(0,0,0,.35) 100%)"></div>
  </div>

  <!-- overlays above photo -->
  <div class="layer" id="over">
    <!-- full-photo meters -->
    <div class="c card" id="meter" style="left:540px;top:300px;width:560px;height:112px;border-radius:26px;display:flex;align-items:center;gap:18px;padding:0 26px;opacity:0">
      <div id="meterIco" class="ico" style="width:62px;height:62px;border-radius:16px;background:#cbab93;box-shadow:none"></div>
      <div style="flex:1"><div class="mono" id="meterLab" style="font-size:19px">nível de desconforto</div><div style="height:10px;border-radius:5px;background:#eee8e2;margin-top:12px;overflow:hidden"><div id="meterBar" style="height:100%;width:0;background:#cbab93"></div></div></div>
      <div id="meterVal" style="font-size:34px;font-weight:700">leve</div>
    </div>
    <!-- floating stickers -->
    <div class="c ico" id="icTooth" style="left:0;top:0;background:#cbab93;opacity:0"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2b1d14" stroke-width="1.7" stroke-linejoin="round"><path d="M7 3C4.5 3 3 5 3 7.5c0 2 1 3.5 1.5 5.5.5 2.5.8 8 2.6 8 1.6 0 1.4-5 3.4-5h3c2 0 1.8 5 3.4 5 1.8 0 2.1-5.5 2.6-8 .5-2 1.5-3.5 1.5-5.5C21 5 19.5 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/></svg></div>
    <div class="c ico" id="icHeart" style="left:0;top:0;background:#5b8def;opacity:0"><svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg></div>
    <div class="c ico" id="icSpark" style="left:0;top:0;background:#1d1a17;opacity:0"><svg width="38" height="38" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 7 7 3-7 3-2 7-2-7-7-3 7-3z"/></svg></div>
    <div class="c ico" id="icChat" style="left:0;top:0;background:#ef7356;opacity:0"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg></div>
    <!-- name tag + stars -->
    <div class="c chip" id="nameTag" style="left:540px;top:1570px;opacity:0"><span class="chk" style="background:#1d1a17;width:34px;height:34px;border-radius:50%"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></span>Maria <span class="mono" style="font-size:20px;letter-spacing:2px">· paciente</span></div>
    <div class="c chip" id="stars" style="left:0;top:0;opacity:0;padding:12px 24px;color:#e0a43a;font-size:34px;letter-spacing:4px">★★★★★ <span style="color:#1d1a17;font-size:28px;letter-spacing:0;font-weight:700">5,0</span></div>
  </div>

  <!-- persistent DEPOIMENTO label -->
  <div class="c" id="tagDep" style="left:540px;top:110px;display:flex;align-items:center;gap:16px;background:#fff;border-radius:40px;padding:16px 34px;box-shadow:0 10px 30px rgba(60,40,20,.14);white-space:nowrap">
    <span style="width:14px;height:14px;border-radius:50%;background:#e45b4c;display:inline-block" id="recDot"></span>
    <span style="font-family:Mono,monospace;font-size:30px;letter-spacing:8px;font-weight:400">DEPOIMENTO</span>
    <span class="serif" style="font-size:40px;color:#9a7a62">· Maria</span>
  </div>

  <div id="capLead"></div>
  <div id="capBox" style="opacity:0"></div>
  <div id="ripple" class="c" style="left:0;top:0;width:100px;height:100px;border-radius:50%;border:4px solid #cbab93;opacity:0"></div>
  <div id="fade" class="layer" style="background:#f2efea;opacity:0"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function S(el,o={}){const {x=0,y=0,s=1,r=0,a=1,b=0,c=true}=o;
  el.style.transform=`${c?'translate(-50%,-50%) ':''}translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;el.style.opacity=a;el.style.filter=b>.1?`blur(${b.toFixed(2)}px)`:'';}
function pop(el,t,t0,dur=.45,base={},from={}){const k=p(t,t0,t0+dur);const e=eback(k),f=eo(k);
  S(el,{...base,s:(base.s??1)*lerp(from.s??.6,1,e),y:(base.y??0)+lerp(from.y??30,0,f),r:(base.r??0)+lerp(from.r??0,0,f),a:(base.a??1)*f,b:(1-f)*(from.b??10)});return k;}
function scene(id,t,a,b,inD=.4,outD=.35){const el=$(id);if(t<a||t>b){el.style.display='none';return null}el.style.display='block';
  const pi=eo(p(t,a,a+inD)),po=eio(p(t,b-outD,b));el.style.opacity=pi*(1-po);const s=lerp(.94,1,pi)*lerp(1,1.04,po);el.style.transform=`scale(${s})`;
  const bl=(1-pi)*12+po*12;el.style.filter=bl>.1?`blur(${bl}px)`:'';return t-a;}

// ---------- photo layouts ----------
const L={FULL:{x:540,y:960,w:1080,h:1920,r:0,rad:0,bw:0},INTRO:{x:540,y:1010,w:700,h:960,r:-3,rad:40,bw:18},
 BR:{x:840,y:1500,w:290,h:400,r:7,rad:28,bw:10},BL:{x:240,y:1520,w:290,h:400,r:-6,rad:28,bw:10},
 MID:{x:540,y:860,w:480,h:600,r:-2,rad:34,bw:16},BIG:{x:540,y:960,w:820,h:1000,r:0,rad:40,bw:24},OUT:{x:540,y:950,w:660,h:780,r:0,rad:40,bw:22}};
const TL=[[-1,'INTRO'],[3.3,'FULL'],[9.35,'BR'],[16.6,'BL'],[20.0,'FULL'],[24.05,'BR'],[27.95,'FULL'],[32.9,'MID'],[37.45,'BIG'],[41.1,'OUT']];
function layoutAt(t){let i=0;while(i<TL.length-1&&t>=TL[i+1][0]-.32)i++;
  const cur=L[TL[i][1]];if(i==0)return {...cur,full:TL[i][1]=='FULL'?1:0};
  const prev=L[TL[i-1][1]];const k=eio(p(t,TL[i][0]-.32,TL[i][0]+.32));
  const o={};for(const key in cur)o[key]=lerp(prev[key],cur[key],k);
  o.full=lerp(TL[i-1][1]=='FULL'?1:0,TL[i][1]=='FULL'?1:0,k);o.k=k;return o;}

// ---------- captions ----------
const SPEC=[['Oi, Paula,','eu tô bem,','top'],['sentindo só um pouco de','desconforto','ph'],['agora, tomando','meus remédios.','ph'],
 ['Estava super','aflita,','top'],['não tinha, tava com','dois dias','top'],['que não tava conseguindo','dormir,','top'],
 ['preocupada, pensando na','dor,','top'],['com','medo,','top'],['mas você me passou muita','confiança,','ph'],['muita','tranquilidade','ph'],
 ['e foi muito','tranquilo,','top'],['não senti nada de','dor.','top'],['Nossa, eu tô muito','surpresa,','ph'],['que trabalho','maravilhoso,','ph'],
 ['você é','incrível,','top'],['me passou toda a','confiança','top'],['','maravilhosamente.','top'],['Nossa,','incrível,','top'],['incrível o','seu trabalho.','top']];
let W=[],CH=[];
function buildCaps(){let wi=0;CH=SPEC.map(([lead,emph,pos])=>{const lw=lead?lead.split(' '):[],ew=emph.split(' ');
  const lt=lw.map(x=>W[wi++]);const et=ew.map(x=>W[wi++]);return {lead:lw,lt,emph,et,pos,t0:(lt[0]||et[0]).s-.1,e:et[et.length-1].e};});
  if(wi!==W.length)console.error('caption/word mismatch',wi,W.length);
  CH.forEach((c,i)=>{const n=CH[i+1];c.t1=n?Math.min(n.t0-.02,c.e+1.6):c.e+1.4;});
  CH[CH.length-1].t1=Math.min(CH[CH.length-1].t1,41.2);
  CH.push({lead:['Sorria','de','novo','com'],lt:[{s:41.45},{s:41.6},{s:41.75},{s:41.9}],emph:'confiança',et:[{s:42.2}],pos:'top',t0:41.35,t1:44.9,e:43});}
let curC=-1;
function renderCaps(t,full){const i=CH.findIndex(c=>t>=c.t0&&t<c.t1);const ld=$('capLead'),bx=$('capBox');
  if(i<0){ld.style.opacity=0;bx.style.opacity=0;return}
  const c=CH[i];if(i!==curC){curC=i;ld.innerHTML=c.lead.map(w=>`<span class="w">${w} </span>`).join('');bx.textContent=c.emph;}
  const top=c.pos=='top';const ly=top?300:1170,by=top?420:1285;
  const ko=eio(p(t,c.t1-.18,c.t1));
  ld.style.top=(ly-30)+'px';ld.style.opacity=1-ko;ld.style.color=top?'#1d1a17':'#fff';ld.style.textShadow=top?'none':'0 3px 18px rgba(0,0,0,.45)';
  [...ld.children].forEach((sp,j)=>{const k=eo(p(t,c.lt[j].s-.08,c.lt[j].s+.12));sp.style.opacity=k;sp.style.transform=`translateY(${(1-k)*14}px)`;sp.style.filter=k<1?`blur(${(1-k)*6}px)`:''});
  const kb=p(t,c.et[0].s-.1,c.et[0].s+.32);
  S(bx,{y:by,s:lerp(.55,1,eback(kb))*(1-.08*ko),r:-1.5+lerp(-5,0,eo(kb)),a:eo(kb)*(1-ko),b:(1-eo(kb))*10,c:false});bx.style.transform='translate(-50%,-50%) '+bx.style.transform;bx.style.top='0px';}

// ---------- build UI ----------
const tk=$('ticks');for(let i=0;i<60;i++){const a=i*6*Math.PI/180;const big=i%5==0;const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',Math.sin(a)*(big?190:200));l.setAttribute('y1',-Math.cos(a)*(big?190:200));l.setAttribute('x2',Math.sin(a)*212);l.setAttribute('y2',-Math.cos(a)*212);
  l.setAttribute('stroke',big?'#1d1a17':'#cfc7bf');l.setAttribute('stroke-width',big?5:2);l.setAttribute('stroke-linecap','round');tk.appendChild(l);}
const ROWS=[['Preocupada','ansiedade',16.88],['Pensando na dor','dor',17.4],['Com medo','medo',19.34],['Sem conseguir dormir','insônia',-1]];
$('rows').innerHTML=ROWS.map((r,i)=>`<div id="row${i}" style="display:flex;align-items:center;gap:22px;height:96px;border-radius:18px;padding:0 22px;margin-bottom:6px">
  <div class="chk" id="rc${i}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2"><path d="M5 12l5 5 9-10"/></svg></div>
  <div style="font-size:36px;font-weight:500;flex:1" id="rt${i}">${r[0]}</div><div class="mono" style="font-size:20px;letter-spacing:1px;text-transform:none">${r[1]}</div></div>`).join('');
const VC=[['Confiança','01',33.72,'M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z'],['Cuidado','02',34.02,'M12 2l2 7 7 3-7 3-2 7-2-7-7-3 7-3z'],['Tranquilidade','03',34.42,'M4 14c3-6 13-6 16 0M4 18c3-4 13-4 16 0'],['Sem dor','04',35.14,'M5 12l5 5 9-10']];
$('vcards').innerHTML=VC.map((v,i)=>`<div class="c card" id="vc${i}" style="left:${150+i*260}px;top:1440px;width:240px;height:290px;border-radius:26px;padding:26px 24px">
  <div style="display:flex;justify-content:space-between"><div style="width:58px;height:58px;border-radius:16px;background:#f3eee9;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1d1a17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${v[3]}"/></svg></div>
  <div class="chk" id="vk${i}" style="width:36px;height:36px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2"><path d="M5 12l5 5 9-10"/></svg></div></div>
