<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Visita Dra. Paulla</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(assets/fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:500;src:url(assets/fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:600;src:url(assets/fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:700;src:url(assets/fonts/inter-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Serif;font-style:italic;src:url(assets/fonts/instrument-serif-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:Mono;src:url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f2efea;font-family:Inter,sans-serif;color:#1d1a17}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#f2efea}
.layer{position:absolute;inset:0}
.c{position:absolute;transform:translate(-50%,-50%)}
.blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.6}
.card{background:#fff;border-radius:30px;box-shadow:0 18px 50px rgba(60,40,20,.12),0 2px 6px rgba(60,40,20,.06)}
.mono{font-family:Mono,monospace;letter-spacing:3px;text-transform:uppercase;color:#9a8f86}
.ico{width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(60,40,20,.18)}
.chk{width:30px;height:30px;border-radius:8px;background:#cbab93;display:flex;align-items:center;justify-content:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:12px;background:#fff;border-radius:30px;padding:12px 24px 12px 14px;font-size:30px;font-weight:500;box-shadow:0 8px 20px rgba(60,40,20,.1);white-space:nowrap}
.scene{position:absolute;inset:0;display:none}
#capLead{position:absolute;left:40px;right:40px;text-align:center;font-size:48px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
#capLead .w{display:inline-block;white-space:pre}
#capBox{position:absolute;left:540px;white-space:nowrap;font-family:Serif,serif;font-style:italic;font-size:104px;line-height:1.08;padding:2px 30px 10px;background:#cbab93;color:#2b1d14;box-shadow:0 10px 30px rgba(80,50,30,.18)}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg">
    <div class="blob" id="b1" style="left:-160px;top:180px;width:620px;height:520px;background:#e9c3a6"></div>
    <div class="blob" id="b2" style="left:640px;top:-80px;width:620px;height:560px;background:#c9dbf2"></div>
    <div class="blob" id="b3" style="left:-120px;top:1380px;width:680px;height:620px;background:#f6dc95"></div>
    <div class="blob" id="b4" style="left:700px;top:1480px;width:600px;height:560px;background:#f4b9a4"></div>
  </div>

  <!-- clock scene -->
  <div class="scene" id="sB">
    <div class="c" id="clock" style="left:540px;top:900px;width:460px;height:460px;border-radius:50%;background:linear-gradient(160deg,#ffffff,#ece8e3);box-shadow:0 30px 60px rgba(60,40,20,.16),inset 0 -6px 14px rgba(0,0,0,.05)">
      <svg width="460" height="460" viewBox="-230 -230 460 460"><g id="ticks"></g>
        <line id="hH" x1="0" y1="0" x2="0" y2="-105" stroke="#1d1a17" stroke-width="10" stroke-linecap="round"/>
        <line id="hM" x1="0" y1="0" x2="0" y2="-160" stroke="#1d1a17" stroke-width="6" stroke-linecap="round"/>
        <line id="hS" x1="0" y1="20" x2="0" y2="-178" stroke="#cbab93" stroke-width="3" stroke-linecap="round"/>
        <circle r="12" fill="#1d1a17"/></svg>
    </div>
    <div class="c" id="years" style="left:400px;top:1255px;font-size:140px;font-weight:700;letter-spacing:-4px;white-space:nowrap">0 anos</div>
    <div class="c mono" id="yearsLab" style="left:400px;top:1345px;font-size:24px;white-space:nowrap">de sorriso novo</div>
    <div class="c card" id="smileBar" style="left:380px;top:1460px;width:540px;height:110px;border-radius:24px;display:flex;align-items:center;gap:20px;padding:0 28px">
      <div class="chk" style="background:#1d1a17;width:34px;height:34px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></div>
      <div style="flex:1"><div style="font-size:28px;font-weight:600">Sorriso em dia</div><div style="height:6px;border-radius:3px;background:#eee8e2;margin-top:10px;overflow:hidden"><div id="sbar" style="height:100%;width:0;background:#cbab93"></div></div></div>
      <div class="mono" id="spct" style="font-size:22px">0%</div>
    </div>
  </div>

  <!-- final chips -->
  <div class="scene" id="sD"><div class="c" id="chips" style="left:540px;top:1530px;display:flex;gap:16px"></div></div>

  <!-- outro input -->
  <div class="scene" id="sE">
    <div class="c card" id="input" style="left:540px;top:1560px;width:900px;height:120px;border-radius:60px;display:flex;align-items:center;gap:22px;padding:0 24px 0 36px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1d1a17" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <div style="font-size:38px;font-weight:600;flex:1"><span id="typed"></span><span id="caret" style="display:inline-block;width:3px;height:40px;background:#1d1a17;vertical-align:middle;margin-left:3px"></span></div>
      <div id="send" style="width:72px;height:72px;border-radius:50%;background:#efe9e3;display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1d1a17" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div>
    </div>
    <div class="c" id="toast" style="left:540px;top:1690px;background:#1d1a17;color:#fff;border-radius:30px;padding:14px 30px;font-size:28px;font-weight:500;white-space:nowrap">✓ te espero no consultório</div>
  </div>

  <!-- VIDEO (frame sequence) -->
  <div class="c" id="photo" style="left:0;top:0;overflow:hidden;background:#cbab93">
    <div id="photoIn" style="position:absolute;overflow:hidden"><img id="pimg" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform-origin:50% 35%"></div>
    <div id="pshade" style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 50%,rgba(0,0,0,.35) 100%)"></div>
  </div>

  <div class="layer" id="over">
    <div class="c card" id="meter" style="left:540px;top:300px;width:560px;height:112px;border-radius:26px;display:flex;align-items:center;gap:18px;padding:0 26px;opacity:0">
      <div class="ico" style="width:62px;height:62px;border-radius:16px;background:#cbab93;box-shadow:none"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2b1d14" stroke-width="1.7" stroke-linejoin="round"><path d="M7 3C4.5 3 3 5 3 7.5c0 2 1 3.5 1.5 5.5.5 2.5.8 8 2.6 8 1.6 0 1.4-5 3.4-5h3c2 0 1.8 5 3.4 5 1.8 0 2.1-5.5 2.6-8 .5-2 1.5-3.5 1.5-5.5C21 5 19.5 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/></svg></div>
      <div style="flex:1"><div class="mono" style="font-size:19px">sorriso lindo</div><div style="height:10px;border-radius:5px;background:#eee8e2;margin-top:12px;overflow:hidden"><div id="meterBar" style="height:100%;width:0;background:#cbab93"></div></div></div>
      <div id="meterVal" style="font-size:34px;font-weight:700">0%</div>
    </div>
    <div class="c ico" id="icTooth" style="background:#cbab93;opacity:0"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2b1d14" stroke-width="1.7" stroke-linejoin="round"><path d="M7 3C4.5 3 3 5 3 7.5c0 2 1 3.5 1.5 5.5.5 2.5.8 8 2.6 8 1.6 0 1.4-5 3.4-5h3c2 0 1.8 5 3.4 5 1.8 0 2.1-5.5 2.6-8 .5-2 1.5-3.5 1.5-5.5C21 5 19.5 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/></svg></div>
    <div class="c ico" id="icHeart" style="background:#5b8def;opacity:0"><svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg></div>
    <div class="c ico" id="icSpark" style="background:#1d1a17;opacity:0"><svg width="38" height="38" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 7 7 3-7 3-2 7-2-7-7-3 7-3z"/></svg></div>
    <div class="c ico" id="icChat" style="background:#ef7356;opacity:0"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg></div>
    <div class="c" id="hugTag" style="left:540px;top:1240px;opacity:0;background:#fff;border-radius:40px;padding:16px 32px;font-size:34px;font-weight:600;box-shadow:0 10px 30px rgba(60,40,20,.2);white-space:nowrap;display:flex;align-items:center;gap:14px"><span style="color:#e45b4c;font-size:38px">♥</span>Mais de 1 ano de <span style="font-family:Serif;font-style:italic;font-weight:400;font-size:46px;color:#9a7458">sorriso novo</span></div>
  </div>

  <!-- top pill (like reference) -->
  <div class="c" id="pill" style="left:540px;top:105px;display:flex;align-items:center;gap:12px;background:#fff;border-radius:30px;padding:12px 26px;box-shadow:0 8px 24px rgba(60,40,20,.12);white-space:nowrap;font-size:26px;font-weight:500">
    <span style="width:12px;height:12px;border-radius:50%;background:#cbab93;display:inline-block"></span>Dra. Paulla Samara <span class="mono" style="font-size:20px;letter-spacing:2px">· consultório</span>
  </div>

  <div id="capLead"></div>
  <div id="capBox" style="opacity:0"></div>
  <div id="fade" class="layer" style="background:#f2efea;opacity:0"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function S(el,o={}){const {x=0,y=0,s=1,r=0,a=1,b=0,c=true}=o;
  el.style.transform=`${c?'translate(-50%,-50%) ':''}translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;el.style.opacity=a;el.style.filter=b>.1?`blur(${b.toFixed(2)}px)`:'';}
function pop(el,t,t0,dur=.45,base={},from={}){const k=p(t,t0,t0+dur);const e=eback(k),f=eo(k);
  S(el,{...base,s:(base.s??1)*lerp(from.s??.6,1,e),y:(base.y??0)+lerp(from.y??30,0,f),r:(base.r??0),a:(base.a??1)*f,b:(1-f)*(from.b??10)});return k;}
function scene(id,t,a,b,inD=.4,outD=.35){const el=$(id);if(t<a||t>b){el.style.display='none';return null}el.style.display='block';
  const pi=eo(p(t,a,a+inD)),po=eio(p(t,b-outD,b));el.style.opacity=pi*(1-po);el.style.transform=`scale(${lerp(.94,1,pi)*lerp(1,1.04,po)})`;
  const bl=(1-pi)*12+po*12;el.style.filter=bl>.1?`blur(${bl}px)`:'';return t-a;}
const NF=608,FPS=30;

// video layouts
const L={FULL:{x:540,y:960,w:1080,h:1920,r:0,rad:0,bw:0},BR:{x:830,y:1430,w:330,h:500,r:7,rad:28,bw:10},
 BIG:{x:540,y:930,w:800,h:1000,r:0,rad:40,bw:24},OUT:{x:540,y:900,w:680,h:860,r:0,rad:40,bw:22}};
const TL=[[-1,'FULL'],[3.55,'BR'],[9.65,'FULL'],[13.25,'BIG'],[18.25,'OUT']];
function layoutAt(t){let i=0;while(i<TL.length-1&&t>=TL[i+1][0]-.3)i++;const cur=L[TL[i][1]];
  if(i==0)return {...cur,full:1};const prev=L[TL[i-1][1]];const k=eio(p(t,TL[i][0]-.3,TL[i][0]+.3));
  const o={};for(const key in cur)o[key]=lerp(prev[key],cur[key],k);o.full=lerp(TL[i-1][1]=='FULL'?1:0,TL[i][1]=='FULL'?1:0,k);return o;}

// captions [lead, emph, pos, skip-words-before]
const SPEC=[['Olha só quem veio','me visitar,','ph'],['olha esse','sorriso lindo.','ph'],
 ['Tem mais de um ano','que a gente fez?','top'],['Tem, tem mais de','um ano.','top'],['Ah é, vai fazer','dois anos.','top'],
 [null,null,null,3],
 ['Isso aqui é o','cartão postal,','top'],['seu e seu, e dos','seus clientes.','top'],['','Amém.','top']];
let W=[],CH=[];
function buildCaps(){let wi=0;CH=[];SPEC.forEach(([lead,emph,pos,skip])=>{if(skip){wi+=skip;return}
  const lw=lead?lead.split(' '):[],ew=emph.split(' ');const lt=lw.map(()=>W[wi++]);const et=ew.map(()=>W[wi++]);
  CH.push({lead:lw,lt,emph,et,pos,t0:(lt[0]||et[0]).s-.1,e:et[et.length-1].e});});
  if(wi!==W.length)console.error('caption/word mismatch',wi,W.length);
  CH.forEach((c,i)=>{const n=CH[i+1];c.t1=n?Math.min(n.t0-.02,c.e+1.2):Math.min(c.e+.9,19.3);});}
let curC=-1;
function renderCaps(t){const i=CH.findIndex(c=>t>=c.t0&&t<c.t1);const ld=$('capLead'),bx=$('capBox');
  if(i<0){ld.style.opacity=0;bx.style.opacity=0;return}
  const c=CH[i];if(i!==curC){curC=i;ld.innerHTML=c.lead.map(w=>`<span class="w">${w} </span>`).join('');bx.textContent=c.emph;}
  const top=c.pos=='top';const ly=top?300:1180,by=top?420:1295;const ko=eio(p(t,c.t1-.18,c.t1));
  ld.style.top=(ly-30)+'px';ld.style.opacity=1-ko;ld.style.color=top?'#1d1a17':'#fff';ld.style.textShadow=top?'none':'0 3px 18px rgba(0,0,0,.5)';
  [...ld.children].forEach((sp,j)=>{const k=eo(p(t,c.lt[j].s-.08,c.lt[j].s+.12));sp.style.opacity=k;sp.style.transform=`translateY(${(1-k)*14}px)`;sp.style.filter=k<1?`blur(${(1-k)*6}px)`:''});
  const kb=p(t,c.et[0].s-.1,c.et[0].s+.32);
  S(bx,{y:by,s:lerp(.55,1,eback(kb))*(1-.08*ko),r:-1.5+lerp(-5,0,eo(kb)),a:eo(kb)*(1-ko),b:(1-eo(kb))*10,c:false});bx.style.transform='translate(-50%,-50%) '+bx.style.transform;bx.style.top='0px';}

// build
const tk=$('ticks');for(let i=0;i<60;i++){const a=i*6*Math.PI/180;const big=i%5==0;const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',Math.sin(a)*(big?180:190));l.setAttribute('y1',-Math.cos(a)*(big?180:190));l.setAttribute('x2',Math.sin(a)*202);l.setAttribute('y2',-Math.cos(a)*202);
  l.setAttribute('stroke',big?'#1d1a17':'#cfc7bf');l.setAttribute('stroke-width',big?5:2);l.setAttribute('stroke-linecap','round');tk.appendChild(l);}
const CHIPS=[['cuidado',14.22],['confiança',15.6],['sorriso no lugar',17.36]];
$('chips').innerHTML=CHIPS.map((c,i)=>`<div class="chip" id="ch${i}"><span class="chk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2"><path d="M5 12l5 5 9-10"/></svg></span>${c[0]}</div>`).join('');
function bob(t,ph){return Math.sin(t*2+ph)*8}
const STK={icTooth:[[2.4,3.4,170,640,-8],[3.9,9.4,180,660,-6],[13.5,18.1,150,1650,-6],[18.4,21,150,1380,-6]],
 icHeart:[[10.9,13.0,880,560,8],[4.3,9.4,930,1180,8],[13.7,18.1,950,1360,6],[18.5,21,940,1300,6]],
 icSpark:[[2.94,3.4,900,500,0],[3.7,9.4,920,560,0],[13.6,18.1,950,500,0],[18.6,21,950,520,0]],
 icChat:[[11.2,13.0,180,760,-6],[13.8,18.1,140,560,-6],[18.7,21,140,560,-6]]};
function stickers(t){for(const id in STK){const el=$(id);const cur=STK[id].find(x=>t>=x[0]&&t<x[1]+.3);if(!cur){el.style.opacity=0;continue}
  const ki=p(t,cur[0],cur[0]+.45),ko=p(t,cur[1],cur[1]+.3);S(el,{x:cur[2],y:cur[3]+bob(t,cur[2]),r:cur[4]+lerp(-25,0,eo(ki)),s:lerp(.3,1,eback(ki))*(1-eo(ko)),a:eo(ki)*(1-eo(ko))});el.style.left='0';el.style.top='0';}}

let lastF=-1;
window.render=async function(t){
  const fr=Math.round(t*30);
  [['b1',0],['b2',1.7],['b3',3.1],['b4',4.4]].forEach(([id,ph])=>{$(id).style.transform=`translate(${Math.sin(t*.35+ph)*50}px,${Math.cos(t*.3+ph)*40}px) scale(${1+.08*Math.sin(t*.5+ph)})`;});
  // video frame
  const fi=Math.min(NF,Math.max(1,Math.floor(t*FPS)+1));
  if(fi!==lastF){lastF=fi;const im=$('pimg');im.src=`frames5/f${String(fi).padStart(4,'0')}.jpg`;await im.decode().catch(()=>{});}
  const P=layoutAt(t);const ph=$('photo');
  ph.style.width=P.w+'px';ph.style.height=P.h+'px';ph.style.borderRadius=P.rad+'px';
  ph.style.transform=`translate(-50%,-50%) translate(${P.x}px,${P.y}px) rotate(${P.r}deg)`;
  ph.style.boxShadow=`0 ${30*(1-P.full)}px ${70*(1-P.full)}px rgba(60,40,20,${.22*(1-P.full)})`;
  const pin=$('photoIn');pin.style.left=pin.style.top=P.bw+'px';pin.style.width=(P.w-2*P.bw)+'px';pin.style.height=(P.h-2*P.bw)+'px';pin.style.borderRadius=Math.max(0,P.rad-P.bw*.6)+'px';
  // punch-in zooms (jump-cut feel) on full-frame emphasis + hug moment
  let zoom=1.02;const fc=CH.find(c=>c.pos=='ph'&&t>=c.t0&&t<c.t1);
  if(fc){const idx=CH.indexOf(fc);const kz=eo(p(t,fc.et[0].s-.1,fc.et[0].s+.15));zoom*=lerp(1,idx%2?1.12:1.07,kz*P.full);}
  if(t>10.6&&t<13.3)zoom*=lerp(1,1.1,eio(p(t,10.6,12.8)));
  $('pimg').style.transform=`scale(${zoom})`;$('pshade').style.opacity=P.full;

  let lt;
  lt=scene('sB',t,3.4,9.75);
  if(lt!==null){pop($('clock'),t,3.6,.6,{},{s:.6,y:60});
    const spin=eio(p(t,4.4,9.2));const hrs=spin*30+(t-3.5)*.05;
    $('hH').setAttribute('transform',`rotate(${300+hrs*30})`);$('hM').setAttribute('transform',`rotate(${hrs*360})`);$('hS').setAttribute('transform',`rotate(${(t*360*6)%360})`);
    pop($('years'),t,5.0,.45,{},{s:.6,y:20});const yv=t<9.0?(t<7.9?'1 ano':'1 ano +'):'2 anos';$('years').textContent=yv;
    $('years').style.transform+=` scale(${1+.12*Math.sin(Math.PI*p(t,9.02,9.35))})`;
    pop($('yearsLab'),t,5.2,.4,{},{s:.8,y:10});pop($('smileBar'),t,6.6,.5,{},{s:.8,y:40});
    const sv=eio(p(t,6.8,8.0));$('sbar').style.width=(sv*100)+'%';$('spct').textContent=Math.round(sv*100)+'%';}
  lt=scene('sD',t,13.2,18.4);
  if(lt!==null){CHIPS.forEach((c,i)=>pop($('ch'+i),t,c[1],.45,{},{s:.5,y:20}));}
  lt=scene('sE',t,18.2,30);
  if(lt!==null){pop($('input'),t,18.35,.5,{},{s:.8,y:40});const s='Agendar avaliação';$('typed').textContent=s.slice(0,Math.floor(s.length*p(t,18.7,19.5)));
    $('caret').style.opacity=(fr%16<9&&t<19.6)?1:0;const sb=Math.sin(Math.PI*p(t,19.55,19.8));$('send').style.background=t>19.55?'#cbab93':'#efe9e3';$('send').style.transform=`scale(${1-.12*sb})`;
    pop($('toast'),t,19.7,.4,{},{s:.6,y:-20});}

  const mk=p(t,2.3,2.7),mo=p(t,3.3,3.55);S($('meter'),{s:lerp(.7,1,eback(mk))*lerp(1,.9,mo),y:lerp(-40,0,eo(mk)),a:eo(mk)*(1-eo(mo)),b:(1-eo(mk))*8+mo*8});
